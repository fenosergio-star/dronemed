databases:
  - name: dronemed-db
    databaseName: drone_med_mada
    user: droneadmin
    plan: free

services:
  - type: web
    name: dronemed-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        value: "*"
      - fromDatabase:
          name: dronemed-db
          property: host
      - fromDatabase:
          name: dronemed-db
          property: port
      - fromDatabase:
          name: dronemed-db
          property: user
      - fromDatabase:
          name: dronemed-db
          property: password
      - fromDatabase:
          name: dronemed-db
          property: database
